spring.application.name=securityJWT

spring.jpa.defer-datasource-initialization=true

logging.level.org.hibernate.SQL=DEBUG

spring.jpa.properties.hibernate.format_sql=true

logging.level.org.springframework.orm.jpa=DEBUG
logging.level.org.springframework.transaction=DEBUG

application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=15m

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
# The H2 console only accepts connections from this computer (default value, written here on purpose).
# Never set it to true: the console gives full read/write access to the database (users, password hashes, roles).
spring.h2.console.settings.web-allow-others=false
